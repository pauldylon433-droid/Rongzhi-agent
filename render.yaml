# Render Blueprint（备用部署；主流程见 docs/cloudbase-deployment.md 的腾讯云 CloudBase 云托管）
# 免费方案无持久磁盘：公网持久演示必须 DB_MODE=cloudbase，业务数据只存 CloudBase PostgreSQL；
# 不得依赖容器内 SQLite。敏感变量在 Render 控制台填写（sync: false）。
# 不购买域名、不启用付费资源；autoDeploy 关闭，避免推送即自动发布。
services:
  - type: web
    name: rongzhi-agent-demo
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: PUBLIC_DEMO
        value: "1"
      # 公网持久演示：业务数据只存 CloudBase PostgreSQL，不依赖免费实例临时磁盘。
      - key: DB_MODE
        value: "cloudbase"
      - key: CLOUDBASE_RPC_BASE
        sync: false
      - key: CLOUDBASE_SERVICE_KEY
        sync: false
      - key: CLOUDBASE_DEMO_USER_ID
        value: "1"
      - key: PUBLIC_AI_ENABLED
        value: "0"
      # 仅在 PUBLIC_AI_ENABLED=1 时使用；三项缺一不可，否则服务拒绝启动
      - key: PUBLIC_AI_RATE_LIMIT_PER_MIN
        value: "6"
      - key: PUBLIC_AI_DAILY_CALL_QUOTA
        value: "200"
      - key: PUBLIC_AI_MAX_CONCURRENCY
        value: "2"
      # 以下为敏感项：在 Render 控制台填写（sync: false），不写入仓库
      - key: DEMO_ACCESS_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VERIFICATION_KEY
        sync: false
      - key: DEMO_VERIFICATION_PASSWORD
        sync: false
      - key: DEMO_TOTP_SECRET
        sync: false
